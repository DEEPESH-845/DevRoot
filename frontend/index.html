<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevRoot</title>
  <meta name="description" content="Root cause, proven by the graph. Graph-native incident investigation on FalkorDB." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M12 3v7m0 0-6 5m6-5 6 5m-12 0v4m12-4v4M12 10v9%22 stroke=%22%238f7cff%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Primary">
    <div>
      <div class="wordmark">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v7m0 0-6 5m6-5 6 5m-12 0v4m12-4v4M12 10v9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="12" cy="3.5" r="1.8" fill="currentColor"/></svg>
        <b>DevRoot</b>
      </div>
      <p class="env">Northstar Labs, synthetic data</p>
    </div>
    <div class="nav">
      <a href="#/overview" data-view="overview"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor"/><rect x="2" y="9" width="12" height="5" rx="1" fill="none" stroke="currentColor"/></svg>Overview</a>
      <a href="#/investigation" data-view="investigation"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor"/></svg>Investigation</a>
      <a href="#/drills" data-view="drills"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v4M8 10v4M2 8h4M10 8h4" stroke="currentColor"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor"/></svg>Fire drills</a>
      <a href="#/history" data-view="history"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" fill="none"/></svg>History<span class="count" id="nav-history"></span></a>
    </div>
    <div class="status" id="status" aria-live="polite"><span><i class="dot"></i>Connecting to FalkorDB…</span></div>
  </nav>

  <div class="main">
    <header class="header" id="header"></header>

    <section class="stage" aria-label="Service graph">
      <div class="canvas-wrap" id="canvas-wrap">
        <div id="canvas" class="canvas"></div>
        <div class="phase-line" id="phase-line"></div>
        <div class="graph-tools" role="toolbar" aria-label="Graph view">
          <button class="btn ghost small" id="fit" title="Fit the graph to the view">Fit</button>
          <button class="btn ghost small" id="reset" title="Clear focus and selection">Reset</button>
          <button class="btn ghost small" id="pixel" aria-pressed="false" title="Agent-directed full-canvas mode (local WebGL, no generated frames)">PixelStream</button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#d5dbe8"/></svg>service</span>
          <span><svg width="10" height="10"><rect x="1" y="1" width="8" height="8" fill="#9db4d0"/></svg>database</span>
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="#8ea2ff" stroke-width="1.5"/></svg>queue / mechanism</span>
          <span><svg width="10" height="10"><path d="M5 0 10 5 5 10 0 5Z" fill="#a98bff"/></svg>change / external</span>
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="#45d4e8"/></svg>signal</span>
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="#ff7a59"/></svg>alert</span>
          <span><svg width="18" height="10"><path d="M0 5h18" stroke="#8ea2ff" stroke-dasharray="3 3"/></svg>async dependency</span>
        </div>
        <div class="hovercard" id="hovercard" hidden></div>
        <aside class="inspector" id="inspector" hidden aria-label="Entity inspector"></aside>
        <div class="fallback" id="fallback" hidden></div>
      </div>
      <div class="transport" aria-label="Replay and time travel">
        <div class="ctl">
          <button class="btn small" id="r-prev" aria-label="Previous step" disabled>◀</button>
          <button class="btn small" id="r-play" disabled>Replay</button>
          <button class="btn small" id="r-next" aria-label="Next step" disabled>▶</button>
        </div>
        <ol class="steps" id="steps" aria-label="Investigation steps"></ol>
        <div class="time empty" id="time">Run an investigation to replay it here and scrub through the incident timeline.</div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Context"></aside>
  </div>
</div>
<p class="sr-only" id="live" aria-live="polite"></p>
<dialog id="rollback" aria-labelledby="rb-title"><div id="rb-body"></div><form method="dialog"><button class="btn primary">Close preview</button></form></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
